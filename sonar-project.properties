sonar.projectKey=hpl-ims-sqe
sonar.projectName=HPL IMS - Requisition (SQE)
sonar.sources=core,inventory,requisition,hpl_ims
sonar.tests=tests/team
sonar.exclusions=**/migrations/**,**/__pycache__/**,static/**,templates/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/tmp/junit-unit.xml
# Coverage is measured on the in-scope business logic only - the SAME list as .coveragerc.
# core/views.py and inventory/views.py are only partly in scope: their in-scope functions are gated
# function-by-function by scripts/team/coverage_gate.py, so Sonar excludes the files from the coverage metric.
sonar.coverage.exclusions=**/migrations/**,**/admin.py,**/apps.py,**/urls.py,**/__init__.py,core/forms.py,inventory/forms.py,core/views.py,inventory/views.py,core/management/**,hpl_ims/**
sonar.sourceEncoding=UTF-8

<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container-fluid">
        <button class="btn btn-link d-md-none" type="button" data-bs-toggle="collapse" 
                data-bs-target="#sidebarMenu">
            <i class="bi bi-list"></i>
        </button>
        
        <div class="d-flex align-items-center">
            <span class="me-3 text-muted">|</span>
            
            <!-- Role Badge -->
            <span class="badge {% if user.is_admin %}bg-danger{% elif user.is_hod %}bg-warning text-dark{% else %}bg-info{% endif %} me-2">
                {{ user.get_role_display }}
            </span>
            
            <!-- Department Badge -->
            {% if user.department %}
            <span class="badge bg-secondary me-3">
                {{ user.department.name }}
            </span>
            {% endif %}
        </div>
        
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav align-items-center">
                <!-- Notifications -->
                <li class="nav-item dropdown me-3">
                    <a class="nav-link position-relative" href="#" role="button" 
                       data-bs-toggle="dropdown" id="notificationDropdown">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                              id="notificationBadge" style="display: none;">
                            0
                        </span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end notification-dropdown" style="width: 350px; max-height: 400px; overflow-y: auto;">
                        <div class="p-2 d-flex justify-content-between align-items-center">
                            <strong>Notifications</strong>
                            <button class="btn btn-sm btn-link text-muted p-0" onclick="markAllNotificationsRead()">
                                Mark all read
                            </button>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div id="notificationList">
                            <div class="text-center text-muted py-3">
                                <i class="bi bi-bell-slash fs-4"></i>
                                <p class="mb-0 small">No new notifications</p>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-center text-primary" href="{% url 'core:notifications' %}">
                            View all notifications
                        </a>
                    </div>
                </li>
                
                <!-- User Menu -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" 
                       role="button" data-bs-toggle="dropdown">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" 
                             style="width: 32px; height: 32px;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <span>{{ user.get_full_name }}</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end">
                        <div class="px-3 py-2">
                            <strong>{{ user.get_full_name }}</strong><br>
                            <small class="text-muted">{{ user.username }}</small>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">
                            <i class="bi bi-person me-2"></i>Profile
                        </a>
                        <a class="dropdown-item" href="#">
                            <i class="bi bi-gear me-2"></i>Settings
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-danger" href="{% url 'core:logout' %}">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script>
// Load notifications on page load and periodically
document.addEventListener('DOMContentLoaded', function() {
    loadNotifications();
    // Refresh notifications every 30 seconds
    setInterval(loadNotifications, 30000);
});

function loadNotifications() {
    fetch('{% url "core:notifications_api" %}')
        .then(response => response.json())
        .then(data => {
            updateNotificationUI(data);
        })
        .catch(error => console.error('Error loading notifications:', error));
}

function updateNotificationUI(data) {
    const badge = document.getElementById('notificationBadge');
    const list = document.getElementById('notificationList');
    
    // Update badge
    if (data.unread_count > 0) {
        badge.textContent = data.unread_count > 9 ? '9+' : data.unread_count;
        badge.style.display = 'inline';
    } else {
        badge.style.display = 'none';
    }
    
    // Update list
    if (data.notifications && data.notifications.length > 0) {
        let html = '';
        data.notifications.forEach(function(n) {
            html += `
                <a class="dropdown-item notification-item ${n.is_read ? '' : 'bg-light'}" 
                   href="${n.link || '#'}" onclick="markNotificationRead(${n.id})">
                    <div class="d-flex align-items-start">
                        <i class="bi ${n.icon} fs-5 me-2"></i>
                        <div class="flex-grow-1">
                            <div class="fw-bold small">${n.title}</div>
                            <small class="text-muted">${n.message.substring(0, 60)}${n.message.length > 60 ? '...' : ''}</small>
                            <div class="text-muted" style="font-size: 0.7rem;">${n.created_at}</div>
                        </div>
                    </div>
                </a>
            `;
        });
        list.innerHTML = html;
    } else {
        list.innerHTML = `
            <div class="text-center text-muted py-3">
                <i class="bi bi-bell-slash fs-4"></i>
                <p class="mb-0 small">No new notifications</p>
            </div>
        `;
    }
}

function markNotificationRead(id) {
    fetch(`/api/notifications/${id}/read/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    }).then(() => loadNotifications());
}

function markAllNotificationsRead() {
    fetch('{% url "core:mark_all_notifications_read" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    }).then(() => loadNotifications());
}
</script>
